<div class="login-wrapper">
    <div class="login-card glass-card">
        <div class="login-header">
            <h2 class="login-title">Welcome Back!</h2>
            <p class="login-subtitle">Sign In to your account</p>
        </div>

        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="text" class="form-control" formControlName="email" placeholder="example@gmail.com" />
                @if (hasError('email', 'required')) {
                <div class="form-error">Email is required.</div>
                }
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <div class="password-field-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" class="form-control password-input" formControlName="password" placeholder="••••••••" />
                    <button type="button" class="toggle-password-btn" (click)="togglePasswordVisibility()" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" title="{{ showPassword ? 'Hide password' : 'Show password' }}">
                        @if (showPassword) {
                        <!-- Eye Off Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        } @else {
                        <!-- Eye Icon -->
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        }
                    </button>
                </div>
                @if (hasError('password', 'required')) {
                <div class="form-error">Password is required.</div>
                }
            </div>

            <div class="form-options">
                <label class="remember-me-label">
                    <input type="checkbox" formControlName="rememberMe" class="custom-checkbox" />
                    <span>Remember me</span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block" [disabled]="loginForm.invalid || loading">
                @if (loading) {
                Authenticating...
                } @else {
                Sign In ➔
                }
            </button>
        </form>

        <div class="auth-switch">
            <span>Don't have an account?</span>
            <a routerLink="/register" class="switch-link">Create Account</a>
        </div>
    </div>
</div>
