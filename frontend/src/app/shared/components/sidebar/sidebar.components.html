<!-- Mobile/Tablet Backdrop Overlay -->
@if (sidebarService.isMobileOpen()) {
<div class="sidebar-backdrop" (click)="sidebarService.closeMobile()"></div>
}

<aside class="sidebar-nav" [class.mobile-open]="sidebarService.isMobileOpen()">
    <div class="sidebar-mobile-header">
        <span class="mobile-title">MAIN MENU</span>
        <button class="btn-icon close-mobile-btn" (click)="sidebarService.closeMobile()">✕</button>
    </div>

    <div class="nav-section">
        <!-- <div class="section-title">MAIN MENU</div>-->

        <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="sidebarService.closeMobile()">
            <span class="nav-icon">📊</span>
            <span class="nav-text">Dashboard</span>
        </a>

        <a routerLink="/employees" routerLinkActive="active" class="nav-item" (click)="sidebarService.closeMobile()">
            <span class="nav-icon">👥</span>
            <span class="nav-text">Employees</span>
        </a>
    </div>
